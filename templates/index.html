<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShield AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #080b16;
            color: white;
        }

        header {
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #20263a;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #00e5ff;
        }

        .status {
            color: #42ff8a;
            font-size: 14px;
        }

        main {
            width: 90%;
            max-width: 1000px;
            margin: 60px auto;
        }

        .hero {
            text-align: center;
            margin-bottom: 40px;
        }

        .shield {
            font-size: 60px;
        }

        h1 {
            font-size: 42px;
            margin: 12px 0;
        }

        .hero p {
            color: #9ca6bd;
            font-size: 17px;
        }

        .card {
            background: #111625;
            border: 1px solid #252d44;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.35);
        }

        label {
            display: block;
            margin-bottom: 12px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            min-height: 170px;
            resize: vertical;
            background: #080b16;
            border: 1px solid #303951;
            border-radius: 12px;
            padding: 16px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        textarea:focus {
            border-color: #00e5ff;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #00e5ff;
            color: #061018;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            background: #080b16;
            border: 1px solid #303951;
        }

        .score {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .reason {
            color: #aab3c7;
            margin-top: 8px;
        }

        footer {
            text-align: center;
            color: #69738a;
            padding: 30px;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
 <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>   
 <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</head>

<body>

<header>
    <div class="logo">🛡️ Cyber<span>Shield</span> AI</div>
    <div class="status">● System Ready</div>
</header>

<main>

    <section class="hero">
        <div class="shield">🛡️</div>
        <h1>Your Personal AI Scam Guardian</h1>
        <p>Analyze suspicious messages and detect potential phishing threats.</p>
    </section>

    <section class="card">

        <label for="message">Paste suspicious message or email</label>
        <label for="qrImage">📷 Or upload a QR code</label>
        <label for="screenshot">📷 Or upload a screenshot</label>
<input type="file" id="qrImage" accept="image/*" onchange="scanQR()"
<input type="file" id="screenshot" accept="image/*" onchange="scanUploadedImage(this)">

                <textarea id="message"
                    placeholder="Example: Congratulations! You won ₹50,000. Click this link to claim your prize..."></textarea>

       <button onclick="scanMessage()">
    🔍 Scan for Threats
</button>

      <div id="result">
    <div class="score" id="score"></div>
    <div style="background:#252d44; border-radius:10px; height:12px; margin:12px 0; overflow:hidden;">
    <div id="riskBar" style="height:100%; width:0%; background:#00e5ff; transition:width 0.5s;"></div>
</div>

    <div id="threat"></div>

    <div class="reason">
        <strong>Why is this suspicious?</strong>
        <p id="reason"></p>
    </div>

    <div class="reason">
        <strong>Confidence:</strong>
        <span id="confidence"></span>
    </div>

    <div class="reason">
        <strong>Safety Advice:</strong>
        <p id="advice"></p>
    </div>
</div>  

    </section>

</main>

<footer>
    CyberShield AI • Smart Protection Against Digital Scams
</footer>

<script>
   async function scanQR() {
    const file = document.getElementById("qrImage").files[0];

    if (!file) {
        return;
    }

    const message = document.getElementById("message");
    message.value = "🔄 Reading QR code...";

    try {
        const image = new Image();
        const imageURL = URL.createObjectURL(file);

        image.onload = function () {
            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d");

            canvas.width = image.width;
            canvas.height = image.height;

            context.drawImage(image, 0, 0);

            const imageData = context.getImageData(
                0,
                0,
                canvas.width,
                canvas.height
            );

            const code = jsQR(
                imageData.data,
                imageData.width,
                imageData.height
            );

            if (code) {
                message.value = code.data;
            } else {
                message.value = "⚠️ Could not detect a QR code in this image.";
            }

            URL.revokeObjectURL(imageURL);
        };

        image.onerror = function () {
            message.value = "⚠️ Could not read the uploaded image.";
            URL.revokeObjectURL(imageURL);
        };

        image.src = imageURL;

    } catch (error) {
        console.error(error);
        message.value = "⚠️ QR code scanning failed.";
    }
}
            
    async function scanScreenshot() {
    const file = document.getElementById("screenshot").files[0];

    if (!file) {
        return;
    }

    document.getElementById("message").value =
        "🔄 Reading screenshot...";

    try {
        const result = await Tesseract.recognize(
            file,
            "eng"
        );

        document.getElementById("message").value =
            result.data.text.trim();
            await scanMessage();

    } catch (error) {
        console.error(error);

        document.getElementById("message").value =
            "⚠️ Could not read the screenshot.";
    }
}


    async function scanMessage() {

        const message = document.getElementById("message").value;

        if (!message.trim()) {
            alert("Please paste a message first.");
            return;
        }

        const resultBox = document.getElementById("result");

        resultBox.style.display = "block";
        document.getElementById("score").innerText = "🔄 Analyzing...";
        document.getElementById("threat").innerText = "";
        document.getElementById("reason").innerText = "";

        try {

            const response = await fetch("/scan", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: message
                })
            });

            const data = await response.json();

            document.getElementById("score").innerText =
                "Risk Score: " + data.score + "/100";

            document.getElementById("riskBar").style.width =
    data.score + "%";
     if (data.score >= 70) {
    document.getElementById("riskBar").style.background = "#ff3b30";
} else if (data.score >= 40) {
    document.getElementById("riskBar").style.background = "#ff9500";
} else if (data.score >= 20) {
    document.getElementById("riskBar").style.background = "#ffd60a";
} else {
    document.getElementById("riskBar").style.background = "#34c759";
}  

            document.getElementById("threat").innerText =
                data.threat;

            document.getElementById("reason").innerText =
                data.reason;
             document.getElementById("confidence").innerText =
    data.confidence;

document.getElementById("advice").innerText =
    data.advice;   

        } catch (error) {

            document.getElementById("score").innerText =
                "⚠️ Error";

            document.getElementById("reason").innerText =
                "Unable to connect to CyberShield server.";
        }
    }
</script>

</body>
</html>
