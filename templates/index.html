<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CyberShield AI</title>

    <!-- QR Scanner Library -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

    <!-- OCR Library -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: white;
        }

        .container {
            width: 80%;
            max-width: 900px;
            margin: 60px auto;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aab3c5;
            font-size: 18px;
            margin-bottom: 40px;
        }

        .box {
            background: #151c32;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0,0,0,0.4);
        }

        textarea {
            width: 90%;
            height: 180px;
            padding: 15px;
            border-radius: 10px;
            border: none;
            resize: none;
            font-size: 16px;
            background: #0e1426;
            color: white;
        }

        button {
            margin-top: 20px;
            padding: 14px 35px;
            border: none;
            border-radius: 8px;
            background: #ff5c35;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ff744f;
        }

        .upload-section {
            margin-top: 30px;
            padding: 20px;
            background: #0e1426;
            border-radius: 10px;
        }

        .upload-section h3 {
            margin-bottom: 15px;
        }

        input[type="file"] {
            margin: 10px;
            padding: 10px;
            color: white;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #0e1426;
            border-radius: 10px;
        }

        .shield {
            font-size: 55px;
        }

        hr {
            border: none;
            border-top: 1px solid #30384f;
            margin: 25px 0;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="shield">🛡️</div>

    <h1>CyberShield AI</h1>

    <p class="subtitle">
        Your Personal AI Scam Guardian
    </p>

    <div class="box">

        <!-- MESSAGE SCANNER -->

        <h2>🔍 Scan a suspicious message</h2>

        <textarea
            id="message"
            placeholder="Paste a suspicious SMS, email, URL or message here..."></textarea>

        <br>

        <button onclick="scanMessage()">
            🔍 SCAN NOW
        </button>


        <!-- QR SCANNER -->

        <div class="upload-section">

            <h3>📱 Or scan a QR code</h3>

            <input
                type="file"
                id="qrImage"
                accept="image/*"
                onchange="scanQR()">

            <p id="qrStatus"></p>

        </div>


        <hr>


        <!-- SCREENSHOT OCR -->

        <div class="upload-section">

            <h3>📸 Or upload a suspicious screenshot</h3>

            <input
                type="file"
                id="screenshot"
                accept="image/*"
                onchange="scanScreenshot()">

            <p id="ocrStatus"></p>

        </div>


        <!-- RESULT -->

        <div id="result" class="result">
            Your analysis will appear here.
        </div>

        <div id="history" class="result">
          <h2>📜 Scan History</h2>
          <p>No scans yet.</p>
       </div>

    </div>

</div>


<script>

let scanHistory = JSON.parse(localStorage.getItem("cybershieldHistory")) || [];

function displayScanHistory() {

    const historyBox = document.getElementById("history");

    if (scanHistory.length === 0) {
        historyBox.innerHTML = `
            <h2>📜 Scan History</h2>
            <p>No scans yet.</p>
        `;
        return;
    }

    historyBox.innerHTML = `
        <h2>📜 Scan History</h2>

        ${scanHistory.map((scan, index) => `
            <div style="
                background: #151c32;
                padding: 15px;
                margin-top: 12px;
                border-radius: 8px;
                text-align: left;
            ">
                <strong>Scan ${index + 1}</strong>
                <p>${scan.message}</p>
                <p>
                    <strong>Risk Score:</strong>
                    ${scan.score}/100
                </p>
                <p>
                    <strong>Risk Level:</strong>
                    ${scan.riskLevel}
                </p>
            </div>
        `).join("")}
    `;
}

displayScanHistory();


// ==========================================
// NORMAL MESSAGE SCANNER
// ==========================================

async function scanMessage() {

    const message =
        document.getElementById("message").value;

    if (message.trim() === "") {
        alert("Please enter a message first.");
        return;
    }

    document.getElementById("result").innerHTML =
        "<p>🔄 Analyzing...</p>";

    try {

        const response = await fetch("/scan", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })
        });

        const data = await response.json();

        const score = Number(data.score);

let riskLevel;
let riskEmoji;

if (score <= 30) {
    riskLevel = "LOW RISK";
    riskEmoji = "🟢";
} else if (score <= 60) {
    riskLevel = "MEDIUM RISK";
    riskEmoji = "🟡";
} else {
    riskLevel = "HIGH RISK";
    riskEmoji = "🔴";
}

scanHistory.unshift({
    message: message.substring(0, 100),
    score: score,
    riskLevel: `${riskEmoji} ${riskLevel}`
});

localStorage.setItem("cybershieldHistory", JSON.stringify(scanHistory));

displayScanHistory();

document.getElementById("result").innerHTML = `

    <h2>Risk Score: ${score}/100</h2>

    <h2>${riskEmoji} ${riskLevel}</h2>

    <h3>${data.threat}</h3>

    <p>${data.reason}</p>

    <p>
        <strong>Confidence:</strong>
        ${data.confidence}
    </p>

    <p>
        <strong>Advice:</strong>
        ${data.advice}
    </p>

`;

    } catch (error) {

        console.error(error);

        document.getElementById("result").innerHTML =
            "<p>⚠️ Could not connect to the server.</p>";
    }
}


// ==========================================
// QR CODE SCANNER
// ==========================================

function scanQR() {

    const file =
        document.getElementById("qrImage").files[0];

    if (!file) {
        return;
    }

    document.getElementById("qrStatus").innerText =
        "🔄 Reading QR code...";


    const reader = new FileReader();


    reader.onload = function(event) {

        const img = new Image();


        img.onload = function() {

            const canvas =
                document.createElement("canvas");

            const context =
                canvas.getContext("2d");


            canvas.width = img.width;
            canvas.height = img.height;


            context.drawImage(
                img,
                0,
                0,
                img.width,
                img.height
            );


            const imageData =
                context.getImageData(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


            const code =
                jsQR(
                    imageData.data,
                    imageData.width,
                    imageData.height,
                    {
                        inversionAttempts: "attemptBoth"
                    }
                );


            if (code) {

                document.getElementById("message").value =
                    code.data;

                document.getElementById("qrStatus").innerText =
                    "✅ QR code detected.";

                // Automatically scan the decoded content
                scanMessage();

            } else {

                document.getElementById("qrStatus").innerText =
                    "⚠️ Could not detect a QR code in this image.";
            }

        };


        img.src = event.target.result;
    };


    reader.readAsDataURL(file);
}


// ==========================================
// SCREENSHOT OCR
// ==========================================

async function scanScreenshot() {

    const file =
        document.getElementById("screenshot").files[0];

    if (!file) {
        return;
    }


    document.getElementById("ocrStatus").innerText =
        "🔄 Reading screenshot...";


    document.getElementById("message").value =
        "🔄 Reading screenshot...";


    try {

        const result =
            await Tesseract.recognize(
                file,
                "eng"
            );


        const text =
            result.data.text.trim();


        if (!text) {

            document.getElementById("ocrStatus").innerText =
                "❌ Could not find readable text.";

            document.getElementById("message").value =
                "";

            return;
        }


        // Put extracted text into message box
        document.getElementById("message").value =
            text;


        document.getElementById("ocrStatus").innerText =
            "✅ Text extracted successfully.";


        // Automatically analyze extracted text
        await scanMessage();


    } catch (error) {

        console.error(error);


        document.getElementById("ocrStatus").innerText =
            "⚠️ Could not read the uploaded image.";

        document.getElementById("message").value =
            "";
    }
}


</script>

</body>
</html>
